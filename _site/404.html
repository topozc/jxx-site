  <script>
    (function () {
      function syncLanguageVisibility(lang) {
        var zhNodes = document.querySelectorAll('.lang-zh');
        var enNodes = document.querySelectorAll('.lang-en');
        var textNodes = document.querySelectorAll('.i18n-text');
        var showZh = lang !== 'en';

        zhNodes.forEach(function (node) {
          node.hidden = !showZh;
          node.setAttribute('aria-hidden', showZh ? 'false' : 'true');
        });

        enNodes.forEach(function (node) {
          node.hidden = showZh;
          node.setAttribute('aria-hidden', showZh ? 'true' : 'false');
        });

        textNodes.forEach(function (node) {
          var value = showZh ? node.getAttribute('data-i18n-zh') : node.getAttribute('data-i18n-en');
          if (value) {
            node.textContent = value;
          }
        });
      }

      function applyLang(lang) {
        var next = lang === 'en' ? 'en' : 'zh';
        var i18n = window.__SITE_I18N__ || {};
        var siteTitle = i18n.siteTitle || {};
        var pageTitle = i18n.pageTitle || {};
        var currentPageTitle = next === 'en' ? pageTitle.en : pageTitle.zh;
        var currentSiteTitle = next === 'en' ? siteTitle.en : siteTitle.zh;

        document.documentElement.setAttribute('data-lang', next);
        document.documentElement.setAttribute('lang', next === 'en' ? 'en' : 'zh-CN');
        syncLanguageVisibility(next);

        if (currentSiteTitle) {
          document.title = i18n.isHome || !currentPageTitle || currentPageTitle === currentSiteTitle
            ? currentSiteTitle
            : currentPageTitle + ' | ' + currentSiteTitle;
        }

        document.querySelectorAll('[data-lang-switch]').forEach(function (button) {
          var active = button.getAttribute('data-lang-switch') === next;
          button.classList.toggle('is-active', active);
          button.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
      }

      document.addEventListener('DOMContentLoaded', function () {
        var savedLang = localStorage.getItem('site-lang');
        var browserLang = (navigator.language || navigator.userLanguage || '').toLowerCase();
        var initialLang = savedLang || (browserLang.indexOf('zh') === 0 ? 'zh' : 'en');
        applyLang(initialLang);
        document.querySelectorAll('[data-lang-switch]').forEach(function (button) {
          button.addEventListener('click', function () {
            var next = button.getAttribute('data-lang-switch');
            localStorage.setItem('site-lang', next);
            document.documentElement.setAttribute('data-lang-preference', '1');
            applyLang(next);
          });
        });
      });
    })();
  </script>
